name: Setup tools
description: Install uv (and optionally Node.js) and create the report directory for the scan jobs.

inputs:
  node:
    description: Whether Node.js should be installed.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - shell: bash
      # Recreated each run so a committed security-report/ never mixes with fresh reports.
      run: rm -rf security-report && mkdir -p security-report

    - if: ${{ inputs.node == 'true' }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 'lts/*'

    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: false
