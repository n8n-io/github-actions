name: OpenSSF Scorecard
description: Score the security posture of the workspace repository, or of a published npm package's source repository.

inputs:
  package:
    description: npm package name. Leave empty to score the workspace repository.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Score the workspace repository
      if: ${{ inputs.package == '' }}
      uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
      with:
        results_file: security-report/scorecard.sarif
        results_format: sarif
        publish_results: false

    - name: Score the package's source repository
      if: ${{ inputs.package != '' }}
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        GITHUB_AUTH_TOKEN: ${{ github.token }}
      run: |
        # pipefail so a scorecard failure isn't masked by tee's exit code.
        set -o pipefail
        # The scorecard binary can't emit SARIF, so keep its native report.
        # Scorecard scores the package's source repository (default branch),
        # not a specific release, so there is no version to select.
        docker run --rm -e GITHUB_AUTH_TOKEN \
          ghcr.io/ossf/scorecard:v5.5.0@sha256:3f24714e9366917adb7a05635382c97dfecb14b21eaef3dfa2ea48c8e23e0795 \
          --npm="$PACKAGE" --format=default | tee security-report/scorecard.txt
