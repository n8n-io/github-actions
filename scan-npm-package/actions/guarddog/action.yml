name: GuardDog
description: Scan a published npm package for malicious behaviour, or verify the dependencies of the workspace package.json.

inputs:
  package:
    description: npm package name. Leave empty to verify the workspace package.json.
    required: false
    default: ''
  version:
    description: Package version or dist-tag.
    required: false
    default: latest
  sandbox:
    description: Whether GuardDog should run inside its kernel-level sandbox.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
        SANDBOX: ${{ inputs.sandbox }}
        GUARDDOG_VERSION: 3.2.0
      run: |
        # pipefail so a GuardDog failure isn't masked by tee's exit code.
        set -o pipefail
        SANDBOX_FLAG=""
        if [ "$SANDBOX" = "false" ]; then
          SANDBOX_FLAG="--no-sandbox"
        fi
        if [ -n "$PACKAGE" ]; then
          # GuardDog scan can't emit SARIF, so keep its native report.
          if [ -n "$VERSION" ] && [ "$VERSION" != "latest" ]; then
            uvx "guarddog==$GUARDDOG_VERSION" npm scan $SANDBOX_FLAG "$PACKAGE" --version "$VERSION" | tee security-report/guarddog.txt
          else
            uvx "guarddog==$GUARDDOG_VERSION" npm scan $SANDBOX_FLAG "$PACKAGE" | tee security-report/guarddog.txt
          fi
        else
          uvx "guarddog==$GUARDDOG_VERSION" npm verify $SANDBOX_FLAG --output-format sarif package.json > security-report/guarddog.sarif
        fi
