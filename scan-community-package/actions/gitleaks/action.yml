name: Gitleaks
description: Scan a published npm package, or the workspace, for hardcoded secrets.

inputs:
  package:
    description: npm package name. Leave empty to scan the workspace.
    required: false
    default: ''
  version:
    description: Package version or dist-tag.
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Install Gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
        # SHA-256 of gitleaks_<version>_linux_<arch>.tar.gz; update both when bumping the version.
        GITLEAKS_SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        GITLEAKS_SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
      run: |
        case "$(uname -m)" in
          x86_64) ARCH=x64; SHA256="$GITLEAKS_SHA256_X64" ;;
          aarch64|arm64) ARCH=arm64; SHA256="$GITLEAKS_SHA256_ARM64" ;;
          *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
        esac
        mkdir -p "$RUNNER_TEMP/gitleaks"
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${ARCH}.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
        echo "${SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
        rm -f "$RUNNER_TEMP/gitleaks.tar.gz"

    - if: ${{ inputs.package != '' }}
      id: fetch
      uses: $/scan-community-package/actions/fetch-package
      with:
        package: ${{ inputs.package }}
        version: ${{ inputs.version }}

    - shell: bash
      env:
        TARGET: ${{ steps.fetch.outputs.path }}
      run: |
        # Leaks go to the report and exit 0, so only a scan that cannot run fails the step.
        "$RUNNER_TEMP/gitleaks/gitleaks" dir "${TARGET:-.}" --report-format sarif --report-path security-report/gitleaks.sarif --exit-code 0
