name: 'CI: Security Scan'
run-name: "${{ inputs.package && format('CI: Security Scan ({0}@{1})', inputs.package, inputs.version) || '' }}"

# Copy this file to .github/workflows/ci-security-scan.yml in the consuming repo
# and replace the pinned SHA.
#
# On push and pull_request the repository's own package.json is scanned and the
# SARIF reports land under Security → Code scanning. Dispatch the workflow with
# a package name to scan a published community node instead; those findings
# only appear in the job summaries.
#
# Scorecard's upstream action supports push and schedule on the default branch;
# it lists pull_request as experimental. Drop `pull_request` or exclude the
# scorecard job from it if that turns out to be noisy.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      package:
        description: 'npm package name to scan (e.g. express or @scope/pkg). Leave empty to scan this repository.'
        required: false
        type: string
      version:
        description: 'Version or dist-tag of the package to scan.'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: ${{ matrix.scanner }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scanner: [guarddog, semgrep, scorecard, osv-scanner, gitleaks]
    steps:
      # A published package is downloaded by the action; only workspace scans
      # need the checkout.
      - if: inputs.package == ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: n8n-io/github-actions/scan-community-node@REPLACE_WITH_SHA # scan-community-node/v1.0.0
        with:
          scanner: ${{ matrix.scanner }}
          package: ${{ inputs.package }}
          version: ${{ inputs.version || 'latest' }}
