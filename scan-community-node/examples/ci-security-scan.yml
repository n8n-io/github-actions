name: 'CI: Security Scan'

# Copy this file to .github/workflows/ci-security-scan.yml in the consuming repo
# and replace the pinned SHA.
#
# On push, pull_request and schedule the repository itself is scanned and the
# SARIF reports are uploaded to Security → Code scanning. Dispatch the workflow
# with a package name to scan a published community node instead; those
# findings appear in the job summaries only.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      package:
        description: 'npm package name to scan (e.g. express or @scope/pkg). Leave empty to scan this repository.'
        required: false
        type: string
      version:
        description: 'Version or dist-tag of the package to scan.'
        required: false
        default: 'latest'
        type: string

# The called workflows declare no permissions and run with this grant.
# security-events: write is needed only for the SARIF upload, and a private
# repository additionally needs actions: read for it.
permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: n8n-io/github-actions/.github/workflows/scan-community-node.yml@REPLACE_WITH_SHA # v1.0.0
    with:
      package: ${{ inputs.package }}
      version: ${{ inputs.version || 'latest' }}
      upload-sarif: ${{ inputs.package == '' }}
