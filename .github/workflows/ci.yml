name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck action scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 #v2.0.2
        with:
          install: true
          version: 11.22.0
          runtime: node@26

      - run: pnpm typecheck

      - name: Release dropdown covers every action
        run: |
          set -euo pipefail
          missing=0
          for path in */action.yml; do
            name="${path%/action.yml}"
            grep -qE "^ +- ${name}$" .github/workflows/release.yml || {
              echo "::error::'${name}' is missing from the package options in .github/workflows/release.yml"
              missing=1
            }
          done
          exit $missing
