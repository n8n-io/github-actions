name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck action scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 #v2.0.2
        with:
          install: true
          version: 11.22.0
          runtime: node@26

      - run: pnpm typecheck

      - name: Release dropdown covers every package
        run: |
          # Every package, action or reusable workflow, is a top-level directory with a README.
          for readme in */README.md; do
            package="${readme%/README.md}"
            grep -qE "^ +- $package$" .github/workflows/release.yml || {
              echo "::error::'$package' is missing from the package options in .github/workflows/release.yml"
              exit 1
            }
          done
