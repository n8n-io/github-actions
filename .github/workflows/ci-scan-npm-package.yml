name: 'CI: Scan npm Package'

on:
  pull_request:
    paths:
      - '.github/workflows/scan-npm-package.yml'
      - '.github/workflows/ci-scan-npm-package.yml'
      - 'scan-npm-package/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A consumer that only scans packages needs nothing beyond contents: read. The called
  # workflow runs with the calling job's permissions and cannot elevate them.
  package:
    uses: $/.github/workflows/scan-npm-package.yml
    with:
      # A published community node with known findings, so package mode has something to report.
      package: n8n-nodes-evolution-api
      version: 1.0.4

  # Scans this repository. The upload stays off: Semgrep and Scorecard do not
  # know `$/` and would report every self-reference here as an unpinned action.
  workspace:
    uses: $/.github/workflows/scan-npm-package.yml
