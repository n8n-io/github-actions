name: 'Scan Community Package'

on:
  workflow_call:
    inputs:
      package:
        description: 'npm package name to scan (e.g. express or @scope/pkg). Leave empty to scan the calling repository.'
        required: false
        type: string
      version:
        description: 'Package version or dist-tag to scan.'
        required: false
        default: 'latest'
        type: string
      upload-sarif:
        description: 'Whether to upload SARIF reports to GitHub code scanning.'
        required: false
        default: false
        type: boolean

jobs:
  summary:
    name: Scan target
    runs-on: ubuntu-latest
    steps:
      - name: Write scan target summary
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$PACKAGE" ]; then
            TARGET="$PACKAGE"
            SCANNED_VERSION="${VERSION:-latest}"
          else
            TARGET="this repository"
            SCANNED_VERSION="n/a"
          fi
          # Strip characters that could break out of the markdown table cell.
          TARGET=$(printf '%s' "$TARGET" | tr -d '\n\r`' | sed 's/|/\\|/g')
          SCANNED_VERSION=$(printf '%s' "$SCANNED_VERSION" | tr -d '\n\r`' | sed 's/|/\\|/g')
          {
            echo "## Security scan target"
            echo ""
            echo "| Package | Version |"
            echo "| --- | --- |"
            echo "| $TARGET | $SCANNED_VERSION |"
          } >> "$GITHUB_STEP_SUMMARY"

  scan-for-insecure-code:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/scan-community-package/actions/setup
        with:
          node: 'true'
      - uses: $/scan-community-package/actions/semgrep
        with:
          package: ${{ inputs.package }}
          version: ${{ inputs.version }}
      - name: Write summary
        if: always()
        uses: $/scan-community-package/actions/security-summary
      - name: Upload SARIF
        if: always()
        uses: $/scan-community-package/actions/upload-security-sarif
        with:
          category: semgrep
          package: ${{ inputs.package }}
          upload: ${{ inputs.upload-sarif }}

  scan-for-misconfiguration:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/scan-community-package/actions/setup
      - uses: $/scan-community-package/actions/scorecard
        with:
          package: ${{ inputs.package }}
      - name: Write summary
        if: always()
        uses: $/scan-community-package/actions/security-summary
      - name: Upload SARIF
        if: always()
        uses: $/scan-community-package/actions/upload-security-sarif
        with:
          category: scorecard
          package: ${{ inputs.package }}
          upload: ${{ inputs.upload-sarif }}

  scan-for-secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/scan-community-package/actions/setup
        with:
          node: 'true'
      - uses: $/scan-community-package/actions/gitleaks
        with:
          package: ${{ inputs.package }}
          version: ${{ inputs.version }}
      - name: Write summary
        if: always()
        uses: $/scan-community-package/actions/security-summary
      - name: Upload SARIF
        if: always()
        uses: $/scan-community-package/actions/upload-security-sarif
        with:
          category: gitleaks
          package: ${{ inputs.package }}
          upload: ${{ inputs.upload-sarif }}
