name: Ownership checks

on:
  workflow_call:
    inputs:
      required-reviews:
        description: 'Write the Required Reviews commit status'
        type: boolean
        default: true
      ownership-comment:
        description: 'Post or update the PR review overview comment'
        type: boolean
        default: true
      pull-request-number:
        description: 'Pull request to evaluate on workflow_dispatch runs'
        type: string
        default: ''
      devhub-url:
        description: 'DevHub base URL for the ownership comment; defaults to the DEVHUB_URL variable'
        type: string
        default: ''
    secrets:
      required-reviews-app-id:
        description: 'ID of the GitHub App trusted to publish Required Reviews'
        required: false
      required-reviews-app-key:
        description: 'Private key for the GitHub App trusted to publish Required Reviews'
        required: false

permissions: {}

jobs:
  resolve-pr:
    name: Resolve pull request for ownership checks
    if: >-
      inputs.required-reviews &&
      contains(fromJSON('["pull_request_target", "pull_request_review", "workflow_run", "workflow_dispatch"]'), github.event_name) &&
      (github.event_name != 'pull_request_target' ||
       github.event.action != 'edited' || github.event.changes.base) &&
      (github.event_name != 'pull_request_target' ||
       (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'large-scale-change') &&
      (github.event_name != 'pull_request_review' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.review.state != 'commented')) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'pull_request_review' &&
        github.event.workflow_run.head_repository.full_name != github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      pull-request-number: ${{ steps.pr.outputs.number }}
      head-sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          INPUT_NUMBER: ${{ inputs.pull-request-number }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_run)
              # The run carries no PR: find the open PR whose head is the run's head.
              # -f fields on a GET are sent as encoded query parameters, so any branch name works.
              number="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" -f state=open -f "head=${RUN_HEAD_OWNER}:${RUN_HEAD_BRANCH}" \
                --jq "map(select(.head.sha == \"${RUN_HEAD_SHA}\"))[0].number // empty")"
              sha="$RUN_HEAD_SHA"
              ;;
            workflow_dispatch)
              number="$INPUT_NUMBER"
              if ! [[ "$number" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::Pass pull-request-number on workflow_dispatch runs."
                exit 1
              fi
              sha=''
              ;;
            *)
              number="$EVENT_NUMBER"
              sha="$EVENT_HEAD_SHA"
              ;;
          esac
          if [ -z "$number" ]; then
            echo "No open pull request for this head; nothing to evaluate."
          fi
          {
            echo "number=$number"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  required-reviews:
    name: Evaluate required reviews
    needs: resolve-pr
    if: >-
      !cancelled() && inputs.required-reviews &&
      (github.event_name == 'merge_group' || needs.resolve-pr.outputs.pull-request-number != '')
    # A pending run can be replaced safely: each run reads the current PR after acquiring the slot.
    concurrency:
      group: ownership-required-reviews-${{ needs.resolve-pr.outputs.pull-request-number || github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Required Reviews credentials
        env:
          APP_ID: ${{ secrets.required-reviews-app-id }}
          APP_KEY: ${{ secrets.required-reviews-app-key }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_KEY" ]]; then
            echo '::error::Pass required-reviews-app-id and required-reviews-app-key. The ruleset must trust this App for Required Reviews.'
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.required-reviews-app-id }}
          private-key: ${{ secrets.required-reviews-app-key }}
          permission-contents: read
          permission-pull-requests: read
          permission-members: read
          permission-statuses: write

      - uses: $/ownership-checks/actions/required-reviews
        with:
          token: ${{ steps.app-token.outputs.token }}
          pull-request-number: ${{ needs.resolve-pr.outputs.pull-request-number }}
          event-head-sha: ${{ needs.resolve-pr.outputs.head-sha }}

  ownership-comment:
    name: Update ownership comment
    if: >-
      inputs.ownership-comment && (inputs.devhub-url != '' || vars.DEVHUB_URL != '') &&
      contains(fromJSON('["pull_request", "pull_request_target"]'), github.event_name) &&
      contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) &&
      github.event.pull_request.user.type != 'Bot' &&
      (github.event_name == 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      id-token: write
    steps:
      - name: Update the ownership comment in DevHub
        continue-on-error: true
        uses: $/ownership-checks/actions/call-devhub
        with:
          devhub-url: ${{ inputs.devhub-url || vars.DEVHUB_URL }}
          path: /api/v1/ci/ownership-comment
          max-time: '10'
          attempts: '1'
          body: '{"pullRequestNumber": ${{ github.event.pull_request.number }}}'
