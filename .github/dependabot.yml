version: 2
updates:
  # SHA pins in the workflows and in every composite action directory.
  - package-ecosystem: github-actions
    directories:
      - /
      - /cla-check
      - /scan-npm-package/actions/*
    schedule:
      interval: weekly
  # Scanner CLIs installed with uvx from a requirements.txt per action.
  - package-ecosystem: pip
    directories:
      - /scan-npm-package/actions/guarddog
      - /scan-npm-package/actions/semgrep
      - /scan-npm-package/actions/security-summary
    schedule:
      interval: weekly
  # Typecheck tooling for the action scripts.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
